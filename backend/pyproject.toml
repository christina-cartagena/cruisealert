[project]
name = "cruisealert-backend"
version = "0.1.0"
description = "CruiseAlert — cruise price tracking & alerts API"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "celery[redis]>=5.4.0",
  "httpx>=0.27.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.1,<4.1",
  "stripe>=9.0.0",
  "sendgrid>=6.11.0",
  "twilio>=9.0.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "email-validator>=2.1.0",
  "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "factory-boy>=3.3.0",
  "aiosqlite>=0.20.0",
  "fakeredis>=2.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
