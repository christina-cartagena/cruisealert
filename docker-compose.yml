services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cruisealert
      POSTGRES_PASSWORD: cruisealert
      POSTGRES_DB: cruisealert
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
